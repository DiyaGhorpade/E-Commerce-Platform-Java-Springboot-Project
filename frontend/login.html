<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Commerce</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p id="error-msg" style="color: red; display: none;">Invalid credentials!</p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                // Call Auth Service via Gateway
                const response = await fetch(`${API_URL}/auth/token`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const token = await response.text();
                    auth.login(token); // Save token
                    window.location.href = "index.html"; // Go to products page
                } else {
                    document.getElementById("error-msg").style.display = "block";
                }
            } catch (err) {
                console.error("Login failed", err);
                document.getElementById("error-msg").innerText = "Server Error";
                document.getElementById("error-msg").style.display = "block";
            }
        });
    </script>
</body>
</html>
